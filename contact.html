</head>
<body><a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header"><div class="site-wrap header-inner"><a class="brand" href="index.html"><span class="brand-mark">말</span><span>말의 여백</span></a><nav class="site-nav" aria-label="주요 메뉴"><a href="index.html#guides">대화 가이드</a><a href="index.html#question-tool">오늘의 질문</a><a href="about.html">사이트 소개</a></nav><button class="theme-toggle" id="theme-toggle" type="button" aria-label="다크 모드로 전환">☾</button></div></header>
  <main id="main">
    <div class="site-wrap page-intro"><p class="eyebrow">CONTACT</p><h1>문의하기</h1><p>글에 대한 의견, 오탈자나 링크 수정 제안, 사이트 이용 문의를 보내주세요. 회신이 필요한 경우 이메일 주소를 남겨 주세요.</p></div>
    <section class="contact-shell" aria-label="문의 양식">
      <form class="contact-form" action="https://formspree.io/f/mzeeezrb" method="POST" target="_blank">
        <input type="hidden" name="_subject" value="[말의 여백] 사이트 문의">
        <label for="contact-name">이름</label><input id="contact-name" name="name" type="text" autocomplete="name" maxlength="80" required>
        <label for="contact-email">이메일</label><input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="contact-topic">문의 주제</label><select id="contact-topic" name="topic" required><option value="" selected disabled>주제를 골라 주세요</option><option>글 내용 또는 정정 제안</option><option>사이트 이용 문의</option><option>제휴 제안</option><option>기타</option></select>
        <label for="contact-message">문의 내용</label><textarea id="contact-message" name="message" maxlength="3000" required></textarea>
        <p class="form-note">개인정보나 비밀번호, 금융 정보 등 민감한 내용은 적지 말아 주세요. 제출한 내용은 Formspree를 통해 전달됩니다. 자세한 내용은 <a href="privacy.html">개인정보 처리 안내</a>를 확인해 주세요.</p>
        <button class="button button-primary form-submit" type="submit">문의 보내기 <span aria-hidden="true">→</span></button>
      </form>
    </section>
  </main>
  <footer class="site-footer"><div class="site-wrap footer-inner"><div><a class="brand footer-brand" href="index.html"><span class="brand-mark">말</span><span>말의 여백</span></a><p>일상에서 나누는 대화를 위한 질문과 표현 안내서.</p></div><nav class="footer-nav" aria-label="사이트 정보"><a href="about.html">사이트 소개</a><a href="contact.html">문의하기</a><a href="privacy.html">개인정보 처리 안내</a></nav><small>© 2026 말의 여백</small></div></footer>
</body></html>
